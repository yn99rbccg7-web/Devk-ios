name: handoff-listener
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: handoff-listener
  cancel-in-progress: true
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 356
    steps:
      - uses: actions/checkout@v4
      - name: run listener
        env:
          TOPIC: nightshift-deck-yn99
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/listener.sh
