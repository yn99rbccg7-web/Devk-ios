name: Sign Deck IPA

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID with the unsigned IPA (default: latest)'
        required: false
        default: ''

jobs:
  sign:
    runs-on: macos-15
    steps:
      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: Deck-ipa
          path: ./unsigned
          run-id: ${{ inputs.run_id != '' && inputs.run_id || '38039651611' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import signing certificate
        run: |
          # Download cert bundle from public source (shared community cert)
          curl -sL -m 30 "https://raw.githubusercontent.com/chargogga-hue/KSign-ESign-Certificate-Files/main/Qingdao%20Rural%20Commercial%20Bank%20Co.%2C%20Ltd%20New.zip" -o /tmp/cert.zip
          cd /tmp && rm -rf cz && mkdir cz && unzip -q -o cert.zip -d cz
          P12_PASSWORD=$(cat cz/password.txt | tr -d '\n\r ')
          echo "P12 password length: ${#P12_PASSWORD}"
          # macOS rejects legacy PKCS12 encryption; re-export with modern algorithms
          openssl pkcs12 -in cz/cert.p12 -passin pass:"$P12_PASSWORD" -out /tmp/cert.pem -nodes 2>/dev/null
          openssl pkcs12 -export -in /tmp/cert.pem -out /tmp/cert_fixed.p12 -passout pass:"$P12_PASSWORD" -certpbe AES-256-CBC -keypbe AES-256-CBC -macalg sha256 2>/dev/null
          echo "Re-exported p12 for macOS compatibility"
          KEYCHAIN=/tmp/signing.keychain-db
          KEYCHAIN_PW=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import /tmp/cert_fixed.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          CERT_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "CERT_NAME=$CERT_NAME" >> $GITHUB_ENV
          echo "Using cert: $CERT_NAME"
          cd -

      - name: Re-sign IPA (bundle ID -> com.SFn27a.5NDvCv)
        run: |
          set -e
          cd ./unsigned
          IPA=$(ls *.ipa | head -1)
          echo "Unpacking $IPA"
          rm -rf Payload && unzip -q "$IPA" -d .
          APP=$(ls -d Payload/*.app | head -1)
          echo "App: $APP"

          # Change bundle ID to match enterprise profile
          NEW_BID="com.SFn27a.5NDvCv"
          echo "Setting bundle ID to $NEW_BID"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW_BID" "$APP/Info.plist"

          # Download profile (public enterprise profile) - already in /tmp/cz from previous step
          cp /tmp/cz/cert.mobileprovision "$APP/embedded.mobileprovision"

          # Re-sign frameworks/dylibs then app
          find "$APP" \( -name "*.framework" -o -name "*.dylib" \) | while read f; do
            codesign --remove-signature "$f" 2>/dev/null || true
            codesign -f -s "$CERT_NAME" --keychain /tmp/signing.keychain-db "$f" || true
          done
          codesign --remove-signature "$APP" 2>/dev/null || true
          codesign -f -s "$CERT_NAME" --keychain /tmp/signing.keychain-db "$APP"

          echo "Verifying:"
          codesign -dvv "$APP" 2>&1 | head -8
          codesign --verify --deep --strict "$APP" && echo "SIGNATURE VALID"

          rm -f ../Deck-signed.ipa
          zip -qr ../Deck-signed.ipa Payload
          cd ..
          ls -lh Deck-signed.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Deck-signed-ipa
          path: Deck-signed.ipa
          retention-days: 30
