name: Sign Deck IPA
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID holding the unsigned IPA (blank = default)'
        required: false
        default: ''
      cert_zip:
        description: 'Cert bundle filename in royilkom-alt/AppleJr'
        required: false
        default: 'Jiangsu Simcere.zip'
      bundle_id:
        description: 'Bundle ID, must equal the profile AppID suffix'
        required: false
        default: 'com.worksin.one'
jobs:
  sign:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: Deck-ipa
          path: ./unsigned
          run-id: ${{ inputs.run_id != '' && inputs.run_id || '38039651611' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import certificate and extract entitlements
        env:
          CERT_ZIP: ${{ inputs.cert_zip }}
        run: |
          set -e
          Z=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['CERT_ZIP']))")
          echo "cert bundle: $CERT_ZIP"
          curl -sL -m 60 "https://github.com/royilkom-alt/AppleJr/raw/refs/heads/main/$Z" -o /tmp/cert.zip
          rm -rf /tmp/cz && mkdir -p /tmp/cz && cd /tmp/cz && unzip -q -o /tmp/cert.zip && cd -
          P12=$(find /tmp/cz -name '*.p12' | head -1)
          PROF=$(find /tmp/cz -name '*.mobileprovision' | head -1)
          echo "P12=$P12"
          echo "PROF=$PROF"
          test -n "$P12"
          test -n "$PROF"
          openssl pkcs12 -in "$P12" -passin pass:"applejr.net" -out /tmp/cert_all.pem -nodes 2>/dev/null
          awk '/BEGIN CERTIFICATE/{c++} c==1' /tmp/cert_all.pem > /tmp/cert.pem
          awk '/BEGIN PRIVATE KEY/{p=1} p' /tmp/cert_all.pem > /tmp/key.pem
          openssl pkcs12 -export -in /tmp/cert.pem -inkey /tmp/key.pem -out /tmp/rebuilt.p12 -passout pass:temppass123 -name "SignCert" 2>/dev/null
          KEYCHAIN=/tmp/signing.keychain-db
          KEYCHAIN_PW=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import /tmp/rebuilt.p12 -k "$KEYCHAIN" -P "temppass123" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          CERT_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "CERT_NAME=$CERT_NAME" >> $GITHUB_ENV
          echo "PROF=$PROF" >> $GITHUB_ENV
          security cms -D -i "$PROF" > /tmp/prof.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/prof.plist > /tmp/ent.plist
          echo "=== profile ==="
          /usr/libexec/PlistBuddy -c 'Print :Name' /tmp/prof.plist
          /usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/prof.plist
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/prof.plist
          echo "=== entitlements to apply ==="
          cat /tmp/ent.plist

      - name: Re-sign IPA
        env:
          NEW_BID: ${{ inputs.bundle_id }}
        run: |
          set -e
          cd ./unsigned
          IPA=$(ls *.ipa | head -1)
          echo "unpacking $IPA"
          rm -rf Payload && unzip -q "$IPA" -d .
          APP=$(ls -d Payload/*.app | head -1)
          echo "app: $APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW_BID" "$APP/Info.plist"
          cp "$PROF" "$APP/embedded.mobileprovision"
          find "$APP" \( -name "*.framework" -o -name "*.dylib" \) | while read f; do
            codesign --remove-signature "$f" 2>/dev/null || true
            codesign -f -s "$CERT_NAME" --keychain /tmp/signing.keychain-db "$f" || true
          done
          codesign --remove-signature "$APP" 2>/dev/null || true
          codesign -f -s "$CERT_NAME" --keychain /tmp/signing.keychain-db --entitlements /tmp/ent.plist "$APP"
          echo "verifying:"
          codesign -dvv "$APP" 2>&1 | head -8
          codesign --verify --deep --strict "$APP" && echo "SIGNATURE VALID"
          rm -f ../Deck-signed.ipa
          zip -qr ../Deck-signed.ipa Payload
          cd ..
          ls -lh Deck-signed.ipa

      - name: G8 self-check
        run: |
          rm -rf /tmp/x && mkdir -p /tmp/x && unzip -o -q Deck-signed.ipa -d /tmp/x
          python3 scripts/g8check.py "$(find /tmp/x -name '*.app' | head -1)"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Deck-signed-ipa
          path: Deck-signed.ipa
          retention-days: 30
