name: Sign Deck IPA

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID with the unsigned IPA (default: latest)'
        required: false
        default: ''

jobs:
  sign:
    runs-on: macos-15
    steps:
      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: Deck-ipa
          path: ./unsigned
          run-id: ${{ inputs.run_id != '' && inputs.run_id || '38039651611' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import signing certificate
        run: |
          # Download cert bundle from public source (shared community cert)
          curl -sL -m 30 "https://github.com/royilkom-alt/AppleJr/raw/refs/heads/main/HSBC%20Bank.zip" -o /tmp/cert.zip
          cd /tmp && rm -rf "HSBC Bank" cz && unzip -q -o cert.zip
          P12_PASSWORD="Mantappu"
          echo "P12 password length: ${#P12_PASSWORD}"
          # Extract as PEM
          openssl pkcs12 -in "HSBC Bank/cert.p12" -passin pass:"$P12_PASSWORD" -out /tmp/cert_all.pem -nodes 2>/dev/null
          awk '/BEGIN CERTIFICATE/{c++} c==1' /tmp/cert_all.pem > /tmp/cert.pem
          awk '/BEGIN PRIVATE KEY/{p=1} p' /tmp/cert_all.pem > /tmp/key.pem
          # Rebuild p12 with modern settings for macOS
          openssl pkcs12 -export -in /tmp/cert.pem -inkey /tmp/key.pem -out /tmp/rebuilt.p12 -passout pass:temppass123 -name "SignCert" 2>/dev/null
          echo "Rebuilt p12"
          KEYCHAIN=/tmp/signing.keychain-db
          KEYCHAIN_PW=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import /tmp/rebuilt.p12 -k "$KEYCHAIN" -P "temppass123" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          CERT_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "CERT_NAME=$CERT_NAME" >> $GITHUB_ENV
          echo "Using cert: $CERT_NAME"
          cd -

      - name: Re-sign IPA (bundle ID -> hk.com.hsbc.enterprise.hsbchkrewards.local2)
        run: |
          set -e
          cd ./unsigned
          IPA=$(ls *.ipa | head -1)
          echo "Unpacking $IPA"
          rm -rf Payload && unzip -q "$IPA" -d .
          APP=$(ls -d Payload/*.app | head -1)
          echo "App: $APP"

          # Change bundle ID to match enterprise profile
          NEW_BID="hk.com.hsbc.enterprise.hsbchkrewards.local2"
          echo "Setting bundle ID to $NEW_BID"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW_BID" "$APP/Info.plist"

          # Download profile (public enterprise profile) - already in /tmp/cz from previous step
          cp "/tmp/HSBC Bank/profile.mobileprovision" "$APP/embedded.mobileprovision"

          # Re-sign frameworks/dylibs then app
          find "$APP" \( -name "*.framework" -o -name "*.dylib" \) | while read f; do
            codesign --remove-signature "$f" 2>/dev/null || true
            codesign -f -s "$CERT_NAME" --keychain /tmp/signing.keychain-db "$f" || true
          done
          codesign --remove-signature "$APP" 2>/dev/null || true
          codesign -f -s "$CERT_NAME" --keychain /tmp/signing.keychain-db "$APP"

          echo "Verifying:"
          codesign -dvv "$APP" 2>&1 | head -8
          codesign --verify --deep --strict "$APP" && echo "SIGNATURE VALID"

          rm -f ../Deck-signed.ipa
          zip -qr ../Deck-signed.ipa Payload
          cd ..
          ls -lh Deck-signed.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Deck-signed-ipa
          path: Deck-signed.ipa
          retention-days: 30
